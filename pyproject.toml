[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "yieldguard"
version = "0.1.0"
description = "Semiconductor process fault detection and SPC vs ML comparison on UCI SECOM."
requires-python = ">=3.11"
authors = [
    { name = "YieldGuard Contributors" }
]
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "pandas>=2.1.0,<3.0.0",
    "pyarrow>=14.0.0",
    "scipy>=1.11.0",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "shap>=0.44.0",
    "pydantic>=2.5.0",
    "pyyaml>=6.0.0",
    "joblib>=1.3.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "mlflow>=2.10.0",
    "evidently>=0.4.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "httpx>=0.26.0",
]

[project.scripts]
yieldguard = "yieldguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q -p no:cacheprovider --basetemp .pytest-tmp"
markers = [
    "integration: tests requiring external data, frozen bundles, or reports",
]
