project:
  name: "YieldGuard"
  version: "0.2.0"
  protocol_version: "v0.2"
  seed: 42

datasets:
  secom:
    dataset_id: "SECOM"
    evaluation_type: "exploratory_post_holdout"
    runs_parquet: "data/processed/runs.parquet"
    labels_dev_parquet: "data/processed/labels_dev.parquet"
    labels_holdout_parquet: "data/processed/labels_holdout.parquet"
    n_blocks: 8
    warmup_blocks: 2
    selection_blocks: 2
  wafer:
    dataset_id: "WAFER_ETCH"
    evaluation_type: "confirmatory_one_shot"
    raw_dir: "data/raw/wafer"
    source_manifest: "data/wafer_source_manifest.json"
    runs_parquet: "data/processed/wafer_runs.parquet"
    labels_parquet: "data/processed/wafer_labels.parquet"
    n_blocks: 10
    warmup_blocks: 2
    selection_blocks: 2

quality_v2:
  max_missing_fraction: 0.50
  max_constant_dominant_fraction: 0.99
  collinearity_threshold: 0.95
  scaling_method: "median_mad"
  clip_z: 25.0

adaptive_spc_v2:
  rolling_window_blocks: 2
  n_monitored_sensors: 10
  max_sensor_missing_fraction: 0.05
  ewma_lambda: 0.20
  ewma_l: 3.0
  tie_break_top3_weight: 0.0001
  tie_break_mean_weight: 0.0000001

adaptive_mspc_v2:
  rolling_window_blocks: 2
  variance_explained_target: 0.80
  max_components: 30
  phase1_trim_alpha: 0.999
  limit_alpha: 0.99

ml_v2:
  iforest_n_estimators: 200
  iforest_rolling_blocks: 2
  xgb_max_depth: 2
  xgb_n_estimators: 120
  xgb_learning_rate: 0.05
  xgb_subsample: 0.8
  xgb_colsample_bytree: 0.6
  xgb_min_child_weight: 3
  recency_decay_gamma: 0.85
  logreg_c: 0.1
  logreg_max_iter: 1000

policy_v2:
  primary_alarm_budget_per_100: 5.0
  alarm_budgets_per_100: [2.0, 5.0, 10.0]
  false_alarm_rates_per_100: [2.0, 5.0, 10.0]
  calibration_window_blocks: 1
  n_bootstraps: 2000
  block_bootstrap_length: 20

targets_v2:
  o1_pr_auc_min_prevalence_multiple: 2.0
  o1_require_ci_lower_above_prevalence: true
  o2_min_recall_at_5_far: 0.25
  o3_alarm_rate_min_per_100: 3.5
  o3_alarm_rate_max_per_100: 6.5
  o4_paired_bootstrap_reported: true
  o5_calib_alarm_rate_min_per_100: 4.5
  o5_calib_alarm_rate_max_per_100: 5.5
  o6_reproducibility_tol: 1.0e-6

outputs_v2:
  models_dir: "models/v0.2.0"
  reports_dir: "reports/v0_2"
